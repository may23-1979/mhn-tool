<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>コード読み取り → 引き換えリンク / QR</title>
<!-- OCR（文字認識） -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<!-- QRコード生成 -->
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
  :root { --accent:#e8742c; --bg:#111; --fg:#f2f2f2; --muted:#999; --card:#1d1d1d; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:520px; margin:0 auto; padding:16px; }
  h1 { font-size:18px; margin:4px 0 12px; }
  .viewer { position:relative; width:100%; aspect-ratio:3/4; background:#000; border-radius:12px; overflow:hidden; }
  video { width:100%; height:100%; object-fit:cover; display:block; }
  /* 読み取り枠（この範囲だけをOCRにかける） */
  .guide { position:absolute; left:8%; right:8%; top:42%; height:16%; border:3px solid var(--accent); border-radius:8px;
           box-shadow:0 0 0 9999px rgba(0,0,0,.45); }
  .guide span { position:absolute; top:-26px; left:0; font-size:12px; color:#fff; }
  .status { margin:10px 0; font-size:14px; color:var(--muted); min-height:1.4em; }
  button { font:inherit; font-size:16px; padding:12px 16px; border:0; border-radius:10px; background:var(--accent); color:#fff; cursor:pointer; }
  button.sub { background:#333; }
  button:disabled { opacity:.5; }
  .row { display:flex; gap:8px; margin:8px 0; }
  .row > * { flex:1; }
  input[type=text] { font:inherit; font-size:18px; letter-spacing:.08em; padding:12px; border-radius:10px; border:1px solid #444;
                     background:#000; color:var(--fg); text-transform:uppercase; width:100%; }
  .card { background:var(--card); border-radius:12px; padding:16px; margin-top:16px; }
  .result a { color:#7fc4ff; word-break:break-all; font-size:14px; }
  .code { font-size:24px; font-weight:700; letter-spacing:.1em; margin:4px 0 10px; }
  #qr { background:#fff; border-radius:8px; padding:8px; display:inline-block; margin-top:12px; }
  #qr svg, #qr img { display:block; width:240px; height:240px; }
  .hidden { display:none; }
  small { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>コード読み取り → 引き換えリンク / QR</h1>

  <div class="viewer">
    <video id="video" playsinline muted autoplay></video>
    <div class="guide"><span>コードをこの枠に合わせてください</span></div>
  </div>

  <div class="status" id="status">「カメラ開始」を押してください</div>

  <div class="row">
    <button id="startBtn">カメラ開始</button>
    <button id="stopBtn" class="sub" disabled>停止</button>
  </div>

  <div class="card">
    <small>手入力・修正もできます（入力すると自動でリンクとQRが更新されます）</small>
    <div class="row">
      <input type="text" id="codeInput" placeholder="例：4JEXF78SYW95R" autocomplete="off" autocapitalize="characters" spellcheck="false">
    </div>
  </div>

  <div class="card result hidden" id="result">
    <small>読み取ったコード</small>
    <div class="code" id="codeText"></div>
    <a id="link" href="#" target="_blank" rel="noopener"></a>
    <div class="row" style="margin-top:12px">
      <button class="sub" id="copyBtn">URLをコピー</button>
      <button class="sub" id="againBtn">もう一度読み取る</button>
    </div>
    <div id="qr"></div>
  </div>
</main>

<script>
(() => {
  // ===== 設定 =====
  const BASE_URL   = 'https://store.monsterhunternow.com/ja/offer-redemption?passcode=';
  const CODE_LEN   = 13;                                   // コードの文字数
  const CODE_RE    = new RegExp(`[A-Z0-9]{${CODE_LEN}}`);  // コードの形式
  const WHITELIST  = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  const SCAN_INTERVAL_MS = 700;   // OCRの間隔
  const CONFIRM_COUNT    = 2;     // 同じ結果が何回連続したら確定するか（誤読防止）

  // ===== 要素 =====
  const $ = id => document.getElementById(id);
  const video = $('video'), statusEl = $('status');
  const startBtn = $('startBtn'), stopBtn = $('stopBtn');
  const codeInput = $('codeInput');
  const resultEl = $('result'), codeText = $('codeText'), linkEl = $('link'), qrEl = $('qr');

  let stream = null, worker = null, scanning = false, lastCode = '', sameCount = 0;
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });

  const setStatus = msg => statusEl.textContent = msg;

  // ===== OCRワーカー準備 =====
  async function getWorker() {
    if (worker) return worker;
    setStatus('文字認識エンジンを読み込み中…（初回は数秒かかります）');
    worker = await Tesseract.createWorker('eng');
    await worker.setParameters({
      tessedit_char_whitelist: WHITELIST,
      tessedit_pageseg_mode: '7',   // 1行のテキストとして認識
    });
    return worker;
  }

  // ===== カメラ =====
  async function startCamera() {
    if (!navigator.mediaDevices?.getUserMedia) {
      setStatus('このブラウザはカメラに対応していません（HTTPSで開いているか確認してください）');
      return;
    }
    startBtn.disabled = true;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
        audio: false,
      });
      video.srcObject = stream;
      await video.play();
      await getWorker();
      stopBtn.disabled = false;
      resultEl.classList.add('hidden');
      lastCode = ''; sameCount = 0;
      scanning = true;
      setStatus('読み取り中… 枠の中にコードを合わせてください');
      scanLoop();
    } catch (e) {
      console.error(e);
      setStatus('カメラを起動できませんでした：' + e.message);
      startBtn.disabled = false;
    }
  }

  function stopCamera() {
    scanning = false;
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null;
    video.srcObject = null;
    startBtn.disabled = false;
    stopBtn.disabled = true;
  }

  // ===== 枠の範囲を切り出して前処理 =====
  function captureGuideArea() {
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) return null;

    // 画面表示(object-fit:cover)上の枠位置 → 実映像座標に変換
    const rect = video.getBoundingClientRect();
    const scale = Math.max(rect.width / vw, rect.height / vh);
    const offX = (vw * scale - rect.width) / 2;
    const offY = (vh * scale - rect.height) / 2;
    const g = document.querySelector('.guide').getBoundingClientRect();
    const sx = (g.left - rect.left + offX) / scale;
    const sy = (g.top  - rect.top  + offY) / scale;
    const sw = g.width / scale, sh = g.height / scale;

    // 2倍に拡大して認識精度を上げる
    const k = 2;
    canvas.width = Math.round(sw * k);
    canvas.height = Math.round(sh * k);
    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);

    // グレースケール＋コントラスト強調
    const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const d = img.data;
    let min = 255, max = 0;
    for (let i = 0; i < d.length; i += 4) {
      const y = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      d[i] = y;
      if (y < min) min = y;
      if (y > max) max = y;
    }
    const range = Math.max(1, max - min);
    let sum = 0;
    for (let i = 0; i < d.length; i += 4) {
      const v = ((d[i] - min) / range) * 255;
      d[i] = v; sum += v;
    }
    // 背景が暗い（白文字）場合は反転して黒文字にする
    const invert = sum / (d.length / 4) < 128;
    for (let i = 0; i < d.length; i += 4) {
      const v = invert ? 255 - d[i] : d[i];
      d[i] = d[i + 1] = d[i + 2] = v;
    }
    ctx.putImageData(img, 0, 0);
    return canvas;
  }

  function extractCode(text) {
    const cleaned = text.toUpperCase().replace(/[^A-Z0-9]/g, '');
    const m = cleaned.match(CODE_RE);
    return m ? m[0] : null;
  }

  async function scanLoop() {
    while (scanning) {
      const c = captureGuideArea();
      if (c) {
        try {
          const { data } = await worker.recognize(c);
          const code = extractCode(data.text);
          if (code) {
            sameCount = (code === lastCode) ? sameCount + 1 : 1;
            lastCode = code;
            // 読み取れた時点ですぐにリンクとQRを表示
            if (codeInput.value !== code) { codeInput.value = code; showResult(code, false); }
            setStatus(`読み取り：${code}（確認中 ${sameCount}/${CONFIRM_COUNT}）`);
            if (sameCount >= CONFIRM_COUNT) {
              if (navigator.vibrate) navigator.vibrate(100);
              stopCamera();
              codeInput.value = code;
              showResult(code, true);
              setStatus('読み取り完了！ 誤りがあれば上の欄で修正して再生成できます');
              return;
            }
          }
        } catch (e) { console.error(e); }
      }
      await new Promise(r => setTimeout(r, SCAN_INTERVAL_MS));
    }
  }

  // ===== リンクとQRの生成 =====
  function showResult(code, scroll = true) {
    const url = BASE_URL + encodeURIComponent(code);
    codeText.textContent = code;
    linkEl.href = url;
    linkEl.textContent = url;

    const qr = qrcode(0, 'M');
    qr.addData(url);
    qr.make();
    qrEl.innerHTML = qr.createSvgTag({ cellSize: 6, margin: 4, scalable: true });

    resultEl.classList.remove('hidden');
    if (scroll) resultEl.scrollIntoView({ behavior: 'smooth' });
  }

  function generateFromInput() {
    const code = codeInput.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (codeInput.value !== code) codeInput.value = code;
    if (!code) { resultEl.classList.add('hidden'); return; }
    setStatus(code.length === CODE_LEN ? '' : `※ ${CODE_LEN}文字ではありません（${code.length}文字）`);
    showResult(code, false);
  }

  // ===== イベント =====
  startBtn.addEventListener('click', startCamera);
  stopBtn.addEventListener('click', () => { stopCamera(); setStatus('停止しました'); });
  codeInput.addEventListener('input', generateFromInput);
  $('againBtn').addEventListener('click', () => { window.scrollTo({ top: 0, behavior: 'smooth' }); startCamera(); });
  $('copyBtn').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(linkEl.href); setStatus('URLをコピーしました'); }
    catch { setStatus('コピーできませんでした。リンクを長押ししてコピーしてください'); }
  });
})();
</script>
</body>
</html>
